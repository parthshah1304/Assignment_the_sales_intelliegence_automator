services:
  sales-automator:
    build: .
    container_name: sales_intelligence_automator
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MAX_CRAWL_PAGES_PER_LEAD=3
    volumes:
      - ./data:/app/data
      - ./leads.db:/app/leads.db
    restart: unless-stopped
